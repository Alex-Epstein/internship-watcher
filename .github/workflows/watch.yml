name: Watcher (Wed+Sun opportunities digest)

on:
  schedule:
    # Wednesday + Sunday 13:30 UTC (~9:30am ET): opportunities digest. Off the
    # :00 slot on purpose -- GitHub drops/delays top-of-hour schedules under load
    # and the hourly sweep fires at :00 too. Observed 2026-10: digest runs were
    # landing 3-5 h late. Opportunities digest --
    # competitions, travel-paid events, hackathons, fellowships. Twice a week
    # because some of these have rolling acceptances you have to pounce on.
    - cron: "30 13 * * 0,3"
    # Hourly role sweep. REINSTATED 2026-08-07, but narrowed: top-tier quant
    # firms only, Fall-2027 cycle only (Alex has a Summer 2027 offer and is
    # interviewing with Citadel for Fall 2027 SWE). Controlled by
    # `top_firms_only` / `fall_2027_only` in config.json -> filters.
    # :17 not :00 -- GitHub throttles top-of-hour schedules; observed Oct 2026
    # only 5-8 of 24 hourly runs were actually firing per day at :00.
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths: ["watcher.py", "config.json", "opportunities.json", "tests/**", ".github/workflows/watch.yml"]
  pull_request:
  workflow_dispatch:      # "Run workflow" button
    inputs:
      mode:
        description: "What to run"
        required: false
        default: digest
        type: choice
        options:
          - digest        # competitions/programs digest (the live one)
          - internships   # full internship sweep (paused; manual only)

permissions:
  contents: write          # allows committing the updated seen_jobs.json

concurrency:
  # Digest gets its own group so it never queues behind (or gets replaced by)
  # a 20-minute hourly sweep. GitHub keeps at most one pending run per group.
  group: ${{ (github.event.schedule == '30 13 * * 0,3' || github.event.inputs.mode == 'digest') && 'digest' || 'watcher' }}
  cancel-in-progress: false

jobs:
  # Every push that touches logic/config runs the pure tests + a DRY_RUN build of
  # the digest against live feeds. A red X here means the next real send would
  # have been broken. Never sends mail, never commits state.
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (no network)
        run: python -m pytest -q tests/test_core.py
      - name: Smoke-build the digest (network, DRY_RUN)
        env:
          SMOKE: "1"
          DRY_RUN: "1"
        run: python -m pytest -q tests/test_smoke_digest.py
      - name: Upload digest preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-preview
          path: digest_preview.html
          if-no-files-found: ignore

  watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          # Digest on the Sunday cron, and on a manual run unless "internships"
          # was explicitly chosen.
          DIGEST_MODE: ${{ (github.event.schedule == '30 13 * * 0,3' || github.event.inputs.mode == 'digest') && '1' || '0' }}
        run: python watcher.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          [ -f OPEN_ROLES.md ] && git add OPEN_ROLES.md || true
          [ -f TOP_PICKS.md ] && git add TOP_PICKS.md || true
          [ -f opportunities.ics ] && git add opportunities.ics || true
          if git diff --quiet --cached; then
            echo "No state changes to push."
            exit 0
          fi
          git commit -m "Update seen jobs [skip ci]"
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "State pushed."
              exit 0
            fi
            echo "Push attempt $i failed (remote moved); retrying..."
            sleep 5
          done
          echo "Could not push state this run; it will retry next run."
